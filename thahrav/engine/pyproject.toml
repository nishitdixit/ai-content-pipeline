[project]
name = "thahrav-engine"
version = "0.1.0"
description = "Thahrav content engine: weekly idea planning and Hinglish script generation"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "groq>=0.30",
    "notion-client>=2.2,<3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
thahrav = "thahrav.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
