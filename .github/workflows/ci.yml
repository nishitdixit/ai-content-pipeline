name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[all,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (no ffmpeg)
        run: pytest

  demo:
    # The full pipeline with real media: ffmpeg synthesizes clips, the studio renders output.mp4.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: pip install -e .
      - name: Run the pipeline end to end
        run: acp demo --workspace demo_run
      - name: Check the render
        run: |
          test -s demo_run/project/renders/latest/output.mp4
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 demo_run/project/renders/latest/output.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: demo-run
          path: |
            demo_run/project/renders/latest/output.mp4
            demo_run/project/renders/latest/edl.json
            demo_run/dashboard.html
            demo_run/profile/scripts/*.md
