[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-pipeline"
version = "0.2.0"
description = "Scripts in your voice, edited into shorts: an LLM script writer and an agentic video editor in one pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Nishit Dixit" }]
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.70"]
groq = ["groq>=0.30"]
notion = ["notion-client>=2.2,<3"]
all = ["ai-content-pipeline[claude,groq,notion]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
acp = "content_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/writer"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E701", "E702", "E731", "B905"]
