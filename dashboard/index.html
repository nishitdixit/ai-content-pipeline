<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Content Pipeline — run dashboard</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a3240;
    --ink:#e8edf4; --muted:#8b97a8; --dim:#5b6675;
    --teal:#2dd4bf; --blue:#5b9dff; --amber:#f0b429; --green:#48c98a;
    --coral:#ff7a59; --purple:#a78bfa; --red:#f0676b;
    --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f4f6fa;--panel:#fff;--panel2:#f0f3f8;--line:#e2e7ef;
      --ink:#161b22;--muted:#5b6675;--dim:#97a1b0;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1060px;margin:0 auto;padding:24px 20px 60px}
  header{display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--teal)}
  .dot.live{animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px}
  .sub{color:var(--dim);font-family:var(--mono);font-size:12px}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button,label.btn{font-family:var(--sans);font-size:13px;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  button:hover,label.btn:hover{background:var(--panel2)}
  button:active{transform:scale(.98)}
  input[type=file]{display:none}
  .rail{display:flex;gap:6px;margin:18px 0 8px;flex-wrap:wrap}
  .stage{font-family:var(--mono);font-size:12px;text-transform:lowercase;
    padding:6px 12px;border-radius:7px;border:1px solid var(--line);
    color:var(--dim);background:var(--panel)}
  .stage.active{color:#08121c;background:var(--blue);border-color:var(--blue)}
  .stage.done{color:var(--green);border-color:color-mix(in srgb,var(--green) 50%,transparent)}
  .bar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:4px 0 22px}
  .bar > span{display:block;height:100%;width:0;background:var(--blue);transition:width .25s}
  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h2{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px}
  .feed{font-family:var(--mono);font-size:12.5px;display:flex;flex-direction:column;gap:7px;
    max-height:360px;overflow:auto}
  .row{display:flex;gap:10px;align-items:baseline;opacity:0;transform:translateY(3px);
    transition:opacity .2s,transform .2s}
  .row.in{opacity:1;transform:none}
  .who{flex:0 0 130px;color:var(--ink)}
  .who.crit{color:var(--amber)} .who.pair{color:var(--purple)} .who.render{color:var(--green)}
  .who.llm{color:var(--teal)} .who.ing{color:var(--blue)}
  .what{color:var(--muted)}
  .tick{color:var(--green)}
  .stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:12.5px}
  .stat:last-child{border-bottom:0}
  .stat .k{color:var(--muted)} .stat .v{color:var(--ink)}
  .pairing{font-family:var(--mono);font-size:12px;color:var(--muted);padding:5px 0;
    display:flex;gap:8px;align-items:center}
  .pairing b{color:var(--purple);font-weight:500}
  .empty{color:var(--dim);font-family:var(--mono);font-size:12px}
  .hint{color:var(--dim);font-size:12px;margin-top:18px;text-align:center;font-family:var(--mono)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="dot" id="dot"></span>
      <div>
        <h1>AI Content Pipeline</h1>
        <div class="sub" id="proj">replaying recorded run</div>
      </div>
    </div>
    <div class="controls">
      <label class="btn">load events.jsonl<input type="file" id="file" accept=".jsonl,.json,.txt"></label>
      <button id="replay">▶ replay</button>
      <button id="speed">1×</button>
    </div>
  </header>

  <div class="rail" id="rail"></div>
  <div class="bar"><span id="fill"></span></div>

  <div class="grid">
    <div class="card">
      <h2>Agent activity</h2>
      <div class="feed" id="feed"></div>
    </div>
    <div>
      <div class="card" style="margin-bottom:16px">
        <h2>Pairings · audio ↔ visuals</h2>
        <div id="pairings"><div class="empty">none yet</div></div>
      </div>
      <div class="card">
        <h2>Run summary</h2>
        <div id="stats"></div>
      </div>
    </div>
  </div>
  <div class="hint">every stage emits to one event bus: script writer, ingest and the edit agents. This view replays real run state.</div>
</div>

<script>
const STAGES = ["script","ingest","retrieve","classify","plan","produce","critique","render"];
const SAMPLE = /*EVENTS*/[
{"type": "stage.enter", "ts": 1792146043.813, "stage": "script"},
{"type": "llm.usage", "ts": 1792146043.815, "provider": "mock", "model": "mock-writer", "schema": "ScriptDraft", "input_tokens": 1540, "output_tokens": 198, "cache_read_tokens": 0, "attempts": 1, "latency_ms": 1},
{"type": "agent.done", "ts": 1792146043.817, "agent": "ScriptWriter", "result": "2026-10-19 P2: [mock] \"Sharma ji ka beta\" is also anxious (168 words, 0 to review)"},
{"type": "stage.enter", "ts": 1792146043.821, "stage": "ingest"},
{"type": "ingest.scan", "ts": 1792146043.821, "found": 12, "known": 0},
{"type": "ingest.analyzing", "ts": 1792146043.821, "file": "boring_filler_dead.mp4", "i": 1, "asset": "a_9303343c"},
{"type": "ingest.analyzed", "ts": 1792146043.821, "file": "boring_filler_dead.mp4", "asset": "a_9303343c", "segments": 1},
{"type": "ingest.analyzing", "ts": 1792146043.821, "file": "climb_grind_wide.mp4", "i": 2, "asset": "a_a1eb9cb4"},
{"type": "ingest.analyzed", "ts": 1792146043.822, "file": "climb_grind_wide.mp4", "asset": "a_a1eb9cb4", "segments": 2},
{"type": "ingest.analyzing", "ts": 1792146043.822, "file": "dream_vista_drone.mp4", "i": 3, "asset": "a_2787645e"},
{"type": "ingest.analyzed", "ts": 1792146043.822, "file": "dream_vista_drone.mp4", "asset": "a_2787645e", "segments": 2},
{"type": "ingest.analyzing", "ts": 1792146043.822, "file": "finish_hero_peak.mp4", "i": 4, "asset": "a_00090cc3"},
{"type": "ingest.analyzed", "ts": 1792146043.823, "file": "finish_hero_peak.mp4", "asset": "a_00090cc3", "segments": 2},
{"type": "ingest.analyzing", "ts": 1792146043.823, "file": "grind_coast_scenery.mp4", "i": 5, "asset": "a_78cae76e"},
{"type": "ingest.analyzed", "ts": 1792146043.823, "file": "grind_coast_scenery.mp4", "asset": "a_78cae76e", "segments": 2},
{"type": "ingest.analyzing", "ts": 1792146043.823, "file": "motivational_rise_wide.mp4", "i": 6, "asset": "a_0ed87227"},
{"type": "ingest.analyzed", "ts": 1792146043.824, "file": "motivational_rise_wide.mp4", "asset": "a_0ed87227", "segments": 2},
{"type": "ingest.analyzing", "ts": 1792146043.824, "file": "push_vlog_talk.mp4", "i": 7, "asset": "a_f4b8a70f"},
{"type": "ingest.analyzed", "ts": 1792146043.825, "file": "push_vlog_talk.mp4", "asset": "a_f4b8a70f", "segments": 2},
{"type": "ingest.analyzing", "ts": 1792146043.825, "file": "ride_coast_wide.mp4", "i": 8, "asset": "a_16b839a7"},
{"type": "ingest.analyzed", "ts": 1792146043.825, "file": "ride_coast_wide.mp4", "asset": "a_16b839a7", "segments": 2},
{"type": "ingest.analyzing", "ts": 1792146043.825, "file": "rise_speech_line.mp4", "i": 9, "asset": "a_46ae75a4"},
{"type": "ingest.analyzed", "ts": 1792146043.825, "file": "rise_speech_line.mp4", "asset": "a_46ae75a4", "segments": 2},
{"type": "ingest.analyzing", "ts": 1792146043.826, "file": "struggle_speech_quote.mp4", "i": 10, "asset": "a_bd724d19"},
{"type": "ingest.analyzed", "ts": 1792146043.826, "file": "struggle_speech_quote.mp4", "asset": "a_bd724d19", "segments": 2},
{"type": "ingest.analyzing", "ts": 1792146043.826, "file": "sunrise_ridge_drone.mp4", "i": 11, "asset": "a_8788b6bc"},
{"type": "ingest.analyzed", "ts": 1792146043.826, "file": "sunrise_ridge_drone.mp4", "asset": "a_8788b6bc", "segments": 3},
{"type": "ingest.analyzing", "ts": 1792146043.826, "file": "triumph_summit_hero.mp4", "i": 12, "asset": "a_73f18b71"},
{"type": "ingest.analyzed", "ts": 1792146043.827, "file": "triumph_summit_hero.mp4", "asset": "a_73f18b71", "segments": 3},
{"type": "ingest.done", "ts": 1792146043.828, "found": 12, "new": 12, "skipped": 0},
{"type": "stage.enter", "ts": 1792146043.83, "stage": "retrieve"},
{"type": "agent.done", "ts": 1792146043.83, "agent": "Retriever", "result": "25 candidates from 25 in memory"},
{"type": "stage.enter", "ts": 1792146043.83, "stage": "classify"},
{"type": "agent.done", "ts": 1792146043.83, "agent": "Casting", "result": "roles: hero 5, b_roll 17, soundbite 3, discard 0"},
{"type": "stage.enter", "ts": 1792146043.83, "stage": "plan"},
{"type": "director.pairing", "ts": 1792146043.831, "audio_from": "a_bd724d19:s_00", "visuals_from": "a_0ed87227:s_00"},
{"type": "director.pairing", "ts": 1792146043.831, "audio_from": "a_46ae75a4:s_01", "visuals_from": "a_8788b6bc:s_00"},
{"type": "director.pairing", "ts": 1792146043.831, "audio_from": "a_f4b8a70f:s_01", "visuals_from": "a_16b839a7:s_01"},
{"type": "agent.done", "ts": 1792146043.831, "agent": "Director", "result": "15 shots, 55.0s"},
{"type": "stage.enter", "ts": 1792146043.831, "stage": "produce"},
{"type": "agent.done", "ts": 1792146043.831, "agent": "CaptionAgent", "result": "hook text on shot 1: '\"Sharma ji ka beta\" is also anxious'"},
{"type": "agent.done", "ts": 1792146043.831, "agent": "Reframer", "result": "reframed 15 shots"},
{"type": "agent.done", "ts": 1792146043.831, "agent": "CaptionAgent", "result": "captioned 4 soundbites"},
{"type": "agent.done", "ts": 1792146043.831, "agent": "AudioMix", "result": "music bed 'subtle_bed', duck -12dB"},
{"type": "stage.enter", "ts": 1792146043.831, "stage": "critique"},
{"type": "agent.done", "ts": 1792146043.831, "agent": "PlatformCritic", "result": "platform checks passed"},
{"type": "agent.done", "ts": 1792146043.831, "agent": "CutQualityCritic", "result": "cut quality ok"},
{"type": "stage.enter", "ts": 1792146043.831, "stage": "render"},
{"type": "render.done", "ts": 1792146043.832, "output": null, "rendered": false, "shots": 15, "duration_s": 55.0}
]/*END_EVENTS*/;

let events = SAMPLE.slice();
const rail = document.getElementById('rail');
const feed = document.getElementById('feed');
const fill = document.getElementById('fill');
const pairBox = document.getElementById('pairings');
const stats = document.getElementById('stats');
const dot = document.getElementById('dot');
let speeds = [1,2,4,0.5], si = 0, timer = null;

function buildRail(){
  rail.innerHTML = '';
  STAGES.forEach(s=>{
    const el = document.createElement('span');
    el.className='stage'; el.dataset.s=s; el.textContent=s;
    rail.appendChild(el);
  });
}
function row(who, cls, what){
  const r=document.createElement('div'); r.className='row';
  r.innerHTML=`<span class="who ${cls}">${who}</span><span class="what">${what}</span>`;
  feed.appendChild(r); requestAnimationFrame(()=>r.classList.add('in'));
  feed.scrollTop=feed.scrollHeight;
}
function reset(){
  buildRail(); feed.innerHTML=''; fill.style.width='0';
  pairBox.innerHTML='<div class="empty">none yet</div>';
  stats.innerHTML=''; dot.classList.add('live');
}
function addStat(k,v){
  const d=document.createElement('div'); d.className='stat';
  d.innerHTML=`<span class="k">${k}</span><span class="v">${v}</span>`;
  stats.appendChild(d);
}
function apply(ev, idx, total){
  if(ev.type==='stage.enter'){
    rail.querySelectorAll('.stage').forEach(s=>{
      const i=STAGES.indexOf(s.dataset.s), cur=STAGES.indexOf(ev.stage);
      s.classList.toggle('active', i===cur);
      if(i<cur) s.classList.add('done');
    });
  } else if(ev.type==='agent.done' || ev.type==='agent.running'){
    const r=document.createElement('div'); r.className='row';
    const cls = /Critic/.test(ev.agent)?'crit':'';
    r.innerHTML=`<span class="who ${cls}">${ev.agent}</span>`+
      `<span class="what">${ev.type==='agent.running'?'↻':'<span class="tick">✓</span>'} ${ev.result||ev.doing||''}</span>`;
    feed.appendChild(r); requestAnimationFrame(()=>r.classList.add('in'));
    feed.scrollTop=feed.scrollHeight;
  } else if(ev.type==='director.pairing'){
    if(pairBox.querySelector('.empty')) pairBox.innerHTML='';
    const d=document.createElement('div'); d.className='pairing';
    d.innerHTML=`<b>${ev.audio_from}</b> → visuals <b>${ev.visuals_from}</b>`;
    pairBox.appendChild(d);
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<span class="who pair">Director</span><span class="what">paired soundbite audio over B-roll</span>`;
    feed.appendChild(r); requestAnimationFrame(()=>r.classList.add('in'));
  } else if(ev.type==='render.done'){
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<span class="who render">Render</span><span class="what">${ev.rendered?'✓ output.mp4 ready':'✓ EDL + render.sh written (no ffmpeg on this machine)'}</span>`;
    feed.appendChild(r); requestAnimationFrame(()=>r.classList.add('in'));
  } else if(ev.type==='critic.flag'){
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<span class="who crit">${ev.agent}</span><span class="what">⚑ ${ev.issue}</span>`;
    feed.appendChild(r); requestAnimationFrame(()=>r.classList.add('in'));
  } else if(ev.type==='llm.usage'){
    row('LLM · '+ev.provider, 'llm', `${ev.schema}: ${ev.input_tokens} in / ${ev.output_tokens} out tokens · ${ev.latency_ms} ms`);
  } else if(ev.type==='ingest.done'){
    row('Ingest', 'ing', `<span class="tick">✓</span> ${ev.new} analyzed, ${ev.skipped} already in memory`);
  } else if(ev.type==='ingest.analyzed'){
    row('Ingest', 'ing', `${ev.file} → ${ev.segments} segment${ev.segments===1?'':'s'}`);
  } else if(ev.type==='ingest.skip'){
    row('Ingest', 'ing', `${ev.file}: already analyzed, skipped`);
  }
  fill.style.width = Math.round(((idx+1)/total)*100)+'%';
}
function summarize(){
  stats.innerHTML='';
  const find=t=>events.filter(e=>e.type===t);
  const cast=events.find(e=>e.agent==='Casting');
  const dir=events.find(e=>e.agent==='Director');
  const writer=events.filter(e=>e.agent==='ScriptWriter' && e.type==='agent.done');
  if(writer.length) addStat('scripts', writer.length+' written');
  const usage=find('llm.usage');
  if(usage.length) addStat('llm tokens', usage.reduce((a,u)=>a+u.input_tokens,0)+' in / '+usage.reduce((a,u)=>a+u.output_tokens,0)+' out ('+usage[0].provider+')');
  const ing=events.find(e=>e.type==='ingest.done');
  if(ing) addStat('ingest','found '+ing.found+' · new '+ing.new+' · skipped '+ing.skipped);
  const ret=events.find(e=>e.agent==='Retriever'); if(ret) addStat('retrieved', ret.result);
  if(cast) addStat('roles', cast.result.replace('roles:','').trim());
  const rend=events.find(e=>e.type==='render.done');
  if(dir) addStat('first plan', dir.result);
  if(rend && rend.shots) addStat('final cut', rend.shots+' shots, '+Number(rend.duration_s).toFixed(1)+'s');
  addStat('pairings', find('director.pairing').length);
  const flags=find('critic.flag').length; addStat('critic flags', flags);
  if(rend) addStat('render', rend.rendered?'output.mp4 ✓':'EDL + render.sh');
  dot.classList.remove('live');
}
function play(){
  if(timer) return;
  reset();
  let i=0; const total=events.length;
  const step=()=>{
    if(i>=total){ clearTimeout(timer); timer=null; summarize(); return; }
    apply(events[i], i, total); i++;
    timer=setTimeout(step, 520/speeds[si]);
  };
  step();
}
document.getElementById('replay').onclick=()=>{ clearTimeout(timer); timer=null; play(); };
document.getElementById('speed').onclick=e=>{ si=(si+1)%speeds.length; e.target.textContent=speeds[si]+'×'; };
document.getElementById('file').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const txt=await f.text();
  events=txt.trim().split('\n').map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean);
  document.getElementById('proj').textContent=f.name+' · '+events.length+' events';
  clearTimeout(timer); timer=null; play();
};
// try fetching a co-located events file; fall back to embedded sample
(async()=>{
  for(const name of ['events.jsonl','sample_events.jsonl']){
    try{ const r=await fetch(name); if(r.ok){
      const t=await r.text();
      const evs=t.trim().split('\n').map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean);
      if(evs.length){ events=evs; document.getElementById('proj').textContent=name+' · '+evs.length+' events'; }
      break;
    }}catch(_){}
  }
  play();
})();
</script>
</body>
</html>
